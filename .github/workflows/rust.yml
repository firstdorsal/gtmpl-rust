name: Rust

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run fmt
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --workspace --verbose
      - name: Run tests
        run: cargo test --workspace --verbose --all-features
      # The default feature set resolves a different dependency graph, and the
      # suites that are not gated behind a feature have to pass under it too.
      - name: Run tests without optional features
        run: cargo test --workspace --verbose
      # `-D warnings` is what makes this a gate. Without it the step reports
      # whatever it finds and still exits 0.
      - name: Run clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - name: Run clippy without optional features
        run: cargo clippy --workspace --all-targets -- -D warnings
      # docs.rs builds with every feature and cannot be re-run with different
      # settings after a publish, so a broken intra-doc link has to fail here.
      - name: Check the documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps
      # The install snippets in the READMEs are what every user copies first. They
      # name the major version, and nothing else ties them to the manifest.
      - name: Check the README install snippets
        run: |
          major=$(sed -n 's/^version = "\([0-9]*\)\..*"$/\1/p' Cargo.toml | head -1)
          test -n "$major" || { echo "::error::no workspace version"; exit 1; }
          stale=$(awk -v major="$major" '
            /^\[dependencies\.gtmpl/ { in_dep = 1; next }
            /^\[/ { in_dep = 0 }
            (in_dep && /^version = "/) || /^gtmpl(-ng|_value_ng|_derive_ng) = / {
              if ($0 !~ "\"" major "(\"|\\.)") print FILENAME ":" FNR ": " $0
            }
          ' README.md gtmpl-ng/README.md gtmpl_value_ng/README.md gtmpl_derive_ng/README.md)
          if [ -n "$stale" ]; then
            echo "::error::README install snippets name a version other than $major:"
            echo "$stale"
            exit 1
          fi
      # Packaging can break on its own -- an `include` that misses a file the tests
      # read, say -- and finding that out at release time is too late.
      - name: Check the packages
        run: cargo package --workspace

  # Every other job runs whatever stable the runner happens to ship, so nothing here
  # tests the `rust-version` the manifests promise. Without this job that promise is
  # just a number: it would keep passing CI while a dependency quietly raised the real
  # floor above it.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The version is read from the manifest rather than written out again, so the two
      # cannot drift apart.
      #
      # Every feature but `helm-functions` is covered, which is what the manifest
      # claims: that one pulls `uuid` and `time`, and those require a newer compiler
      # themselves, so `--all-features` here would only be testing their floor.
      #
      # `check` and not `test`, because dev-dependencies are the suite's business and
      # not a consumer's -- holding them to this floor would pin it to criterion's.
      - name: Check at the declared minimum version
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$msrv" || { echo "::error::no rust-version in the workspace manifest"; exit 1; }
          echo "declared minimum: $msrv"
          rustup toolchain install "$msrv" --profile minimal --no-self-update
          rustup run "$msrv" cargo check --workspace \
            --features gtmpl-ng/gtmpl_dynamic_template,gtmpl-ng/gtmpl_value_compat,gtmpl-ng/mows-functions,gtmpl_value_ng/serde

  # The engine's README is doc-tested through `include_str!`; the root README cannot be,
  # so its examples are compiled and run here. Without this they are the only code in
  # the repository nothing checks -- and they are the first code a reader runs.
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the README examples
        run: bash ci/check-readme-examples.sh

  publish:
    needs: [build, msrv, readme]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          # merge-base needs history, not just the tagged commit.
          fetch-depth: 0
      # A version on crates.io can never be replaced, so refuse to ship one from a
      # commit that main does not contain: deleting the branch afterwards would
      # orphan the published source, and the next release cut from main would
      # silently revert it.
      - name: Require the tag to be on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_SHA is not an ancestor of origin/main; merge the release branch first"; exit 1; }
      # A tag that disagrees with the manifest would republish an old version or
      # publish an unintended one; refuse it before anything leaves the machine.
      - name: Require the tag to match the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          test "$GITHUB_REF_NAME" = "v$version" \
            || { echo "::error::tag $GITHUB_REF_NAME does not match workspace version $version"; exit 1; }
      # All three crates share one version and go out together. `--workspace` puts
      # them in dependency order and waits for each to appear in the index before
      # the next one is verified against it, which publishing them separately would
      # have to do by hand.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace
