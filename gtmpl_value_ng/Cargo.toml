[package]
name = "gtmpl_value_ng"
description = "Internal value format for gtmpl-ng, the Golang templating language for Rust"
documentation = "https://docs.rs/crate/gtmpl_value_ng"
keywords = ["gtmpl-ng", "gtmpl", "golang", "template", "templating"]
categories = ["template-engine"]
readme = "README.md"
include = ["Cargo.toml", "src/**/*.rs", "README.md", "LICENSE"]
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[badges]
maintenance = { status = "actively-developed" }

[features]
# Conversions from the published `gtmpl_value` 0.5 types, for migrating a tree that
# still uses the original derive macro. Off by default: it pulls in that crate.
gtmpl_value_compat = ["dep:gtmpl_value"]
serde = ["dep:serde"]

# As in `gtmpl-ng`: docs.rs would otherwise leave `serde` and `gtmpl_value_compat`
# undocumented on a page that cannot be rebuilt later.
[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
serde_json = "1"
# Only to prove the migration example: it derives against the published crate and
# converts, which is the whole point of `gtmpl_value_compat`.
gtmpl_derive = "0.5"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde = { workspace = true, optional = true }
gtmpl_value = { version = "0.5", optional = true }
